# nginx site for Zentra (docs/deploy.md). Replace zentra.example.com with your domain, then get the
# certificate with: sudo certbot --nginx -d zentra.example.com
# The site and the realtime socket share one domain, so the sign-in cookie reaches both.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name zentra.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name zentra.example.com;

  # certbot fills these in
  # ssl_certificate     /etc/letsencrypt/live/zentra.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/zentra.example.com/privkey.pem;

  client_max_body_size 30m;

  # Realtime: people walking together and live chat (server/realtime.js)
  location /ws {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # The site (next start)
  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
